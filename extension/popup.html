<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SiteScout</title>

  <link rel="stylesheet" href="popup.css">
</head>

<body>

  <div class="app">

    <!-- HEADER -->
    <header class="header">

      <div class="brand">

        <div class="brand-icon">
          ⌕
        </div>

        <div class="brand-text">
          <h1>SiteScout</h1>
          <p>AI assistant for this webpage</p>
        </div>

      </div>

      <div class="status">
        <span class="status-dot"></span>
        <span>Ready</span>
      </div>

    </header>


    <!-- MAIN -->
    <main class="content">

      <!-- HERO -->
      <section class="hero">

        <div class="hero-icon">
          ✦
        </div>

        <h2>
          What would you like to know?
        </h2>

        <p>
          Choose an action below and SiteScout will
          analyze the webpage you're currently viewing.
        </p>

      </section>


      <!-- QUICK ACTIONS -->
      <section class="quick-actions">

        <!-- SUMMARY -->
        <button
          type="button"
          class="quick-action"
          data-query="Summarize this page"
        >

          <span class="action-icon">
            ✦
          </span>

          <div class="action-content">
            <strong>Summarize this page</strong>
            <small>Get the main idea in seconds</small>
          </div>

          <span class="arrow">
            →
          </span>

        </button>


        <!-- IMPORTANT INFORMATION -->
        <button
          type="button"
          class="quick-action"
          data-query="Find the most important information on this page"
        >

          <span class="action-icon">
            ★
          </span>

          <div class="action-content">
            <strong>Find important information</strong>
            <small>See the most useful points</small>
          </div>

          <span class="arrow">
            →
          </span>

        </button>


        <!-- EXPLAIN SIMPLY -->
        <button
          type="button"
          class="quick-action"
          data-query="Explain this page simply"
        >

          <span class="action-icon">
            ✧
          </span>

          <div class="action-content">
            <strong>Explain this page simply</strong>
            <small>Make complex content easier</small>
          </div>

          <span class="arrow">
            →
          </span>

        </button>

      </section>


      <!-- DIVIDER -->
      <div class="divider">
        <span>OR ASK YOUR OWN QUESTION</span>
      </div>


      <!-- CUSTOM QUESTION -->
      <section class="input-section">

        <textarea
          id="questionInput"
          rows="3"
          placeholder="Ask anything about this page..."
        ></textarea>

        <button
          id="askButton"
          type="button"
        >

          <span>
            Ask SiteScout
          </span>

          <span class="send-icon">
            →
          </span>

        </button>

      </section>

    </main>


    <!-- FOOTER -->
    <footer class="footer">

      <span>
        SiteScout
      </span>

      <span>
        AI-powered webpage assistant
      </span>

    </footer>

  </div>


  <script src="popup.js"></script>

</body>

</html>
