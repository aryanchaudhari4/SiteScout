<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SiteScout</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo-row">
        <span class="logo">🔎</span>
        <h1>SiteScout</h1>
      </div>
      <p>AI assistant for this page</p>
    </div>

    <button id="openBtn" class="open-btn">Open SiteScout</button>

    <div id="statusRow" class="status-row">
      <span id="statusDot" class="status-dot status-checking"></span>
      <span id="statusText">Checking backend...</span>
    </div>

    <div id="messageBox" class="message-box" hidden></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
